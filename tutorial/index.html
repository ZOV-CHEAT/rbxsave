<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RbxEconomy - How to download</title>
    <link rel="icon" href="../icon.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../tutorial.css">
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <nav>
        <div class="brand">RbxEconomy</div>
        <a href="/main">Main</a>
        <a href="/tutorial" class="active">How to download?</a>
    </nav>
    <div class="tutorial-page">
        <h1>How to Download</h1>
        <p class="subtitle">Follow these steps to install the extension.</p>
        <div class="steps-grid">
            <div class="step">
                <div class="step-header">
                    <div class="step-num">1</div>
                    <div class="step-title">Step 1</div>
                </div>
                <img src="../assets/1.png" alt="Step 1">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">2</div>
                    <div class="step-title">Step 2</div>
                </div>
                <img src="../assets/2.png" alt="Step 2">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">3</div>
                    <div class="step-title">Step 3</div>
                </div>
                <img src="../assets/3.png" alt="Step 3">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">4</div>
                    <div class="step-title">Step 4</div>
                </div>
                <img src="../assets/4.png" alt="Step 4">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">5</div>
                    <div class="step-title">Step 5</div>
                </div>
                <img src="../assets/5.png" alt="Step 5">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">6</div>
                    <div class="step-title">Step 6</div>
                </div>
                <img src="../assets/6.png" alt="Step 6">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">7</div>
                    <div class="step-title">Step 7</div>
                </div>
                <img src="../assets/7.png" alt="Step 7">
                <div class="step-text">test</div>
            </div>
            <div class="step">
                <div class="step-header">
                    <div class="step-num">8</div>
                    <div class="step-title">Step 8</div>
                </div>
                <img src="../assets/8.png" alt="Step 8">
                <div class="step-text">test</div>
            </div>
        </div>
        <a href="/main" class="back-link">&larr; Back to main page</a>
    </div>
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="Zoomed">
        <div class="lightbox-hint">Click anywhere to close</div>
    </div>
    <footer>RbxEconomy &mdash; 2026</footer>
    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        class Particle {
            constructor() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.r = Math.random() * 1.5 + 0.5;
                this.dx = (Math.random() - 0.5) * 0.3;
                this.dy = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.dx;
                this.y += this.dy;
                if (this.x < 0 || this.x > W) this.dx *= -1;
                if (this.y < 0 || this.y > H) this.dy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(233, 69, 96, ${this.alpha})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 80; i++) particles.push(new Particle());
        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(233, 69, 96, ${0.06 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }
        function animate() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        document.querySelectorAll('.step img').forEach(img => {
            img.addEventListener('click', e => {
                e.stopPropagation();
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });
        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') lightbox.classList.remove('active');
        });
    </script>
</body>
</html>
