<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antibrainrot Kid Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .counter-container {
            font-size: 4rem;
            font-weight: bold;
            color: #f43f5e;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
            margin-bottom: 20px;
            min-width: 150px;
            text-align: center;
        }

        .click-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(29, 78, 216, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            user-select: none;
        }

        .click-btn:hover {
            box-shadow: 0 12px 30px rgba(29, 78, 216, 0.6);
            transform: translateY(-2px);
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .status {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #10b981;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>antibrainrot_kid</h1>
    <div class="subtitle">Очисти свой разум от рилсов и тиктоков</div>

    <div class="counter-container" id="counter">0</div>
    
    <button class="click-btn" id="clickBtn">КЛИК!</button>

    <div class="status" id="statusText">Статус: Загрузка базы...</div>

    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');
        const btnEl = document.getElementById('clickBtn');
        const statusEl = document.getElementById('statusText');

        const statuses = [
            { limit: 0, text: "Статус: Начинающий сигма" },
            { limit: 15, text: "Статус: Детокс начался" },
            { limit: 40, text: "Статус: Скибиди-иммунитет повышен" },
            { limit: 75, text: "Статус: Мега-мозг" },
            { limit: 120, text: "Статус: Гигачад без брэйнрота 👑" }
        ];

        function updateStatus() {
            let currentStatus = statuses[0].text;
            for (let i = 0; i < statuses.length; i++) {
                if (count >= statuses[i].limit) {
                    currentStatus = statuses[i].text;
                }
            }
            statusEl.textContent = currentStatus;
        }

        btnEl.addEventListener('click', () => {
            count++;
            counterEl.textContent = count;
            
            // Легкая анимация увеличения цифр при клике
            counterEl.style.transform = 'scale(1.1)';
            setTimeout(() => counterEl.style.transform = 'scale(1)', 50);
            
            updateStatus();
        });

        // Инициализация стартового статуса
        updateStatus();
    </script>
</body>
</html>
